name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（必须已存在，例如 v1.2.0）'
        required: true

# 说明：新版本号首次发布直接推 tag；已经打过 tag 想重跑，用 Actions 页面上的
# 「Run workflow」手动触发并填同一个 tag —— 删 tag 再重推会让 GitHub 把已有 Release 变成 draft。
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 打包并发布 Release
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 准备 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 仓库里的 gradlew 是自制脚本，CI 直接用官方发行版更稳
      - name: 准备 Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: 还原发布密钥
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::未配置 secret RELEASE_KEYSTORE_BASE64，缺少发布密钥"
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: 构建已签名的 Release APK
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # tag 与应用版本必须一致，否则发出去的包和版本号会对不上
          VERSION_NAME=$(awk -F'"' '/versionName[[:space:]]*=/ { print $2; exit }' app/build.gradle.kts)
          if [ "$VERSION_NAME" != "${TAG#v}" ]; then
            echo "::error::tag $TAG 与 app/build.gradle.kts 的 versionName ($VERSION_NAME) 不一致"
            exit 1
          fi

          gradle assembleRelease \
            -PchinaMirror=false \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/release.keystore" \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD" \
            --no-daemon --stacktrace

      - name: 准备发布说明与安装包
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          # 发布说明优先取 CHANGELOG.md 里对应的版本段，让变更日志与 Release 同一份来源
          # 段落结束于下一个二级标题（## ）或文件末尾的链接定义区（[xxx]: ...）
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## / { found = 0; next }
            found && /^\[/ { found = 0; next }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/changelog-section.md"

          if [ ! -s "$RUNNER_TEMP/changelog-section.md" ]; then
            # CHANGELOG 里没有这一段，就退回用该 tag 之前的提交标题兜底
            PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
            if [ -n "$PREV_TAG" ]; then
              git log --no-merges --pretty=format:'- %s' "$PREV_TAG..$TAG" > "$RUNNER_TEMP/changelog-section.md"
            else
              git log --no-merges --pretty=format:'- %s' -20 "$TAG" > "$RUNNER_TEMP/changelog-section.md"
            fi
          else
            # 带上文件末尾的链接定义，条目里的 [短哈希] 才会渲染成可点击的提交链接
            grep -E '^\[[^]]+\]:' CHANGELOG.md >> "$RUNNER_TEMP/changelog-section.md" || true
          fi

          {
            echo "## 爱车保养 $TAG / Car Maintenance $TAG"
            echo
            echo "### 更新内容 / What's changed"
            echo
            cat "$RUNNER_TEMP/changelog-section.md"
            echo
            echo "### 安装 / Install"
            echo "下载下方 APK 侧载安装（Android 8.0+ / minSdk 26）。"
            echo "Download the APK below and sideload it (Android 8.0+)."
            echo
            echo "> APK 用项目固定的发布密钥签名；安装时若提示签名不一致，请先卸载旧版本。"
            echo "> The APK is signed with the project's release key. Uninstall any previous build first if you see a signature conflict."
          } > "$RUNNER_TEMP/release-notes.md"

          # 必须产出「已签名」的 APK，未签名的包用户装不上
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "::error::未产出已签名的 app-release.apk，检查签名配置与密钥"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/dist"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/dist/car-maintenance-$TAG.apk"
          ls -l "$RUNNER_TEMP/dist"

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/dist/car-maintenance-$TAG.apk"
          PRERELEASE=""
          case "$TAG" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
            # --draft=false 是必要的：删过 tag 再重推，GitHub 会把已有 Release 变成 draft
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false
          else
            gh release create "$TAG" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --title "爱车保养 $TAG / Car Maintenance $TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              $PRERELEASE
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,isDraft
